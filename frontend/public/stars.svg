<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!--
    Static starfield for the Astronacci dashboard background.
    ~80 stars, no animation, ~1.5KB. Rendered once by the browser as a
    cached compositor layer — 0% main-thread CPU when idle.
    Colors: white/blue tints at low opacity to read against #05060f.
  -->
  <g fill="#ffffff">
    <circle cx="120" cy="90"  r="0.8" opacity="0.7"/>
    <circle cx="240" cy="200" r="1.2" opacity="0.85"/>
    <circle cx="380" cy="60"  r="0.6" opacity="0.5"/>
    <circle cx="520" cy="180" r="0.9" opacity="0.7"/>
    <circle cx="660" cy="40"  r="1.4" opacity="0.9"/>
    <circle cx="800" cy="120" r="0.7" opacity="0.6"/>
    <circle cx="940" cy="220" r="1.0" opacity="0.75"/>
    <circle cx="1080" cy="80" r="0.8" opacity="0.65"/>
    <circle cx="1220" cy="160" r="1.3" opacity="0.85"/>
    <circle cx="1360" cy="50" r="0.6" opacity="0.5"/>
    <circle cx="1500" cy="200" r="0.9" opacity="0.7"/>
    <circle cx="1640" cy="100" r="1.1" opacity="0.8"/>
    <circle cx="1780" cy="30"  r="0.7" opacity="0.6"/>
    <circle cx="1860" cy="180" r="1.0" opacity="0.75"/>

    <circle cx="80"  cy="340" r="0.9" opacity="0.7"/>
    <circle cx="220" cy="460" r="1.3" opacity="0.85"/>
    <circle cx="360" cy="380" r="0.6" opacity="0.5"/>
    <circle cx="500" cy="520" r="1.0" opacity="0.75"/>
    <circle cx="640" cy="420" r="0.8" opacity="0.65"/>
    <circle cx="780" cy="560" r="1.2" opacity="0.85"/>
    <circle cx="920" cy="480" r="0.7" opacity="0.6"/>
    <circle cx="1060" cy="600" r="1.4" opacity="0.9"/>
    <circle cx="1200" cy="440" r="0.6" opacity="0.5"/>
    <circle cx="1340" cy="580" r="0.9" opacity="0.7"/>
    <circle cx="1480" cy="500" r="1.1" opacity="0.8"/>
    <circle cx="1620" cy="620" r="0.7" opacity="0.6"/>
    <circle cx="1760" cy="460" r="1.0" opacity="0.75"/>
    <circle cx="1880" cy="560" r="0.8" opacity="0.65"/>

    <circle cx="60"  cy="720" r="1.1" opacity="0.8"/>
    <circle cx="200" cy="840" r="0.7" opacity="0.6"/>
    <circle cx="340" cy="760" r="1.3" opacity="0.85"/>
    <circle cx="480" cy="900" r="0.6" opacity="0.5"/>
    <circle cx="620" cy="820" r="0.9" opacity="0.7"/>
    <circle cx="760" cy="960" r="1.0" opacity="0.75"/>
    <circle cx="900" cy="860" r="1.4" opacity="0.9"/>
    <circle cx="1040" cy="980" r="0.7" opacity="0.6"/>
    <circle cx="1180" cy="800" r="0.8" opacity="0.65"/>
    <circle cx="1320" cy="940" r="1.2" opacity="0.85"/>
    <circle cx="1460" cy="860" r="0.6" opacity="0.5"/>
    <circle cx="1600" cy="1000" r="0.9" opacity="0.7"/>
    <circle cx="1740" cy="880" r="1.1" opacity="0.8"/>
    <circle cx="1880" cy="1020" r="0.7" opacity="0.6"/>

    <circle cx="150" cy="1040" r="0.8" opacity="0.65"/>
    <circle cx="300" cy="1000" r="1.0" opacity="0.75"/>
    <circle cx="560" cy="1060" r="0.6" opacity="0.5"/>
