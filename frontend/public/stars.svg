  <!-- A few blue-tinted brighter stars for depth -->
  <g fill="#a8c8ff">
    <circle cx="430" cy="150" r="1.6" opacity="0.9"/>
    <circle cx="990" cy="300" r="1.8" opacity="0.95"/>
    <circle cx="1450" cy="250" r="1.5" opacity="0.85"/>
    <circle cx="700" cy="700" r="1.7" opacity="0.9"/>
    <circle cx="1280" cy="720" r="1.6" opacity="0.85"/>
    <circle cx="1800" cy="700" r="1.8" opacity="0.95"/>
  </g>
  <!-- Faint nebula blobs (static, low-opacity) -->
  <g opacity="0.18">
    <circle cx="1500" cy="200" r="180" fill="#4a90d9"/>
    <circle cx="300" cy="800" r="220" fill="#e27b58"/>
