[project]
name = "quant"
version = "0.1.0"
description = "Quantitative Trading System — IDX Swing Trading (renovated from market app)"
requires-python = ">=3.11"
dependencies = [
    # Database
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    # Computation
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Astronomy (market session sunrise/sunset)
    "ephem>=4.1",
    # HMM regime detection
    "hmmlearn>=0.3",
    # GPU (optional — see [project.optional-dependencies] cuda / cpu)
    "torch>=2.2",
    # Web
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # HTTP / scraping
    "requests>=2.32",
    "cloudscraper>=1.2",
    "curl_cffi>=0.7",
    # Utils
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
# CUDA-accelerated torch for NVIDIA GPUs.
# Install with:  pip install -e ".[cuda]"
# On Windows:    pip install torch --index-url https://download.pytorch.org/whl/cu121
# On Linux:      pip install torch --index-url https://download.pytorch.org/whl/cu121
cuda = [
    "torch>=2.2",
]
# CPU-only torch fallback (no CUDA).
# Install with:  pip install -e ".[cpu]"
cpu = [
    "torch>=2.2",
]
# ML / boosting libraries (lazy-imported, optional)
ml = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "shap>=0.45",
]
# Reinforcement learning (lazy-imported, optional)
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
# NLP / transformers for sentiment analysis (lazy-imported, optional)
nlp = [
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
